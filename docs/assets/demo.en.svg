<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="-apple-system,Segoe UI,Helvetica,Arial,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" role="img" aria-label="Synthetic episode 03: video says the block is in the zone, the load cell shows it left the plate. Vision-only verdict PASS, TaskWitness verdict FAIL.">
